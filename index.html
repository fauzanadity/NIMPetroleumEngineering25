<!DOCTYPE html>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DATABASE TEKNIK PERMINYAKAN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f19;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:32px 16px;display:flex;flex-direction:column;align-items:center}

/* Palet Warna: Deep Slate, Teal & Soft Mint */
:root{
  --accent:#14b8a6;
  --accent-dim:#0d9488;
  --accent-glow:rgba(20,184,166,0.1);
  --surface:#111827;
  --surface2:#1f2937;
  --surface3:#374151;
  --border:#374151;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --green:#34d399;
  --red:#f87171;
  --radius:12px
}

.page-header{text-align:center;margin-bottom:36px}
.page-header h1{font-size:1.5rem;font-weight:700;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.page-header p{color:var(--muted);font-size:0.875rem}

.container{width:100%;max-width:1100px;display:none}
.container.active{display:block}

/* Sticky Top Navigation & Stats Wrapper */
.sticky-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #0b0f19; /* Menutup konten di bawahnya saat scroll */
  padding: 12px 0;
  border-bottom: 1px solid transparent;
  transition: all 0.2s ease;
}

.toggle-wrap{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 24px;width:fit-content;margin:0 auto 28px;font-size:0.8rem;color:var(--muted)}
.toggle-wrap .label-on{color:var(--accent);font-weight:600}
.switch{position:relative;display:inline-block;width:44px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#374151;border-radius:22px;transition:.3s;border:1px solid var(--border)}
.slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(22px)}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.main-btn{background:var(--surface2);color:var(--accent);border:1px solid var(--border);padding:18px;cursor:pointer;border-radius:var(--radius);font-weight:600;font-size:0.875rem;text-align:center;transition:.2s ease;letter-spacing:.5px}
.main-btn:hover{background:var(--accent-glow);border-color:var(--accent);transform:translateY(-2px)}
.db-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:100%;padding:16px;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:0.875rem;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.db-btn:hover{background:var(--surface3);border-color:#4b5563}

.back-nav{display:inline-flex;align-items:center;gap:6px;color:var(--accent);cursor:pointer;font-size:0.875rem;font-weight:500;margin-bottom:14px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);transition:.2s}
.back-nav:hover{background:var(--accent-glow);border-color:var(--accent)}

.section-title{font-size:1.1rem;font-weight:600;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.game-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.game-table th{color:var(--muted);text-align:left;padding:0 14px 8px;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;font-weight:500}
.game-table tr.data-row{background:var(--surface2);border-radius:var(--radius)}
.game-table tr.data-row td{padding:12px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:0.875rem;vertical-align:middle}
.game-table tr.data-row td:first-child{border-left:1px solid var(--border);border-radius:var(--radius) 0 0 var(--radius)}
.game-table tr.data-row td:last-child{border-right:1px solid var(--border);border-radius:0 var(--radius) var(--radius) 0}
.game-table tr.data-row:hover td{background:var(--surface3)}

.game-table input[type=text]{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:#111827;color:var(--text);font-size:0.85rem;transition:.2s;outline:none}
.game-table input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.game-table input.correct{border-color:var(--green);color:var(--green);background:rgba(52,211,153,0.05)}
.game-table input.wrong{border-color:var(--red);background:rgba(248,113,113,0.05)}

.status-cell{text-align:center;font-size:1.1rem;min-width:45px}

.give-up-btn{display:block;margin-top:4px;font-size:0.7rem;color:var(--red);background:none;border:none;cursor:pointer;text-decoration:underline;padding:2px 4px;border-radius:4px;width:100%;text-align:center}
.give-up-btn:hover{background:rgba(248,113,113,0.1)}

.search-box{width:100%;padding:13px 16px;font-size:0.95rem;margin-bottom:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius);outline:none;transition:.2s}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.search-box::placeholder{color:var(--muted)}

.stat-bar{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat-pill span{color:var(--accent);font-weight:600;font-size:0.9rem;display:inline-block}

/* RESPONSIVE LAYOUT UNTUK HP (MAX 700PX) */
@media(max-width:700px){
  body{padding:16px 12px}
  .page-header{margin-bottom:24px}
  
  /* Membuat area header game melayang kokoh saat scroll di HP */
  .sticky-header {
    background: #0b0f19;
    padding: 10px 4px 14px 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  
  .menu-grid{grid-template-columns:1fr 1fr; gap:8px}
  .main-btn { padding: 14px 10px; font-size: 0.8rem; }
  
  /* Tabel berubah wujud menjadi tumpukan kartu (cards) yang rapi */
  .game-table thead{display:none}
  .game-table{border-spacing:0 16px} /* Memberikan jarak bernafas antar card mahasiswa */
  
  .game-table tr.data-row{
    display:flex;
    flex-direction:column;
    padding:16px;
    gap:14px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 4px 6px -1px rgba(0,0,0,0.2);
  }
  
  .game-table tr.data-row td{
    border:none!important;
    border-radius:0!important;
    padding:0;
    width:100%;
  }
  
  /* Desain label penunjuk kolom (NIM, Nama, Asal) di dalam card HP */
  .game-table tr.data-row td::before{
    content:attr(data-label);
    color:var(--muted);
    font-size:.65rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    display:block;
    margin-bottom:6px;
    opacity:0.75;
  }
  
  .game-table tr.data-row:hover td{background:transparent}
  
  /* Tata letak status & tombol bantuan di pojok bawah card */
  .status-cell {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    border-top: 1px dashed var(--border) !important;
    padding-top: 12px !important;
    margin-top: 4px;
  }
  .status-cell::before {
    margin-bottom: 0 !important;
    align-self: center;
  }
  
  .give-up-btn{text-align:right;width:auto;display:inline-block;margin-top:0;font-size:0.75rem}
}
</style>
</head>

let wrongCounters={}; 

function showScreen(id){
  document.querySelectorAll('.container').forEach(c=>c.classList.remove('active'));

  window.scrollTo(0,0);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function init(){
  const btn=document.getElementById('range-buttons');
  btn.innerHTML='';
  for(let i=0;i<studentsData.length;i+=10){
    const s=i+1,e=Math.min(i+10,studentsData.length);
    const d=document.createElement('div');
    d.className='main-btn';
    d.textContent=`...${String(s).padStart(3,'0')} – ...${String(e).padStart(3,'0')}`;
    d.onclick=()=>startGame(i,e);
    btn.appendChild(d);
  }
  searchDatabase();
}

function startGame(start,end){

  document.getElementById('game-title').textContent=`NIM ${String(start+1).padStart(3,'0')} – ${String(end).padStart(3,'0')}`;

  if(document.getElementById('shuffle-toggle').checked) slice=shuffle(slice);

  updateStat();

  const tbody=document.getElementById('game-body');
  tbody.innerHTML='';

    tr.className='data-row';
    const nimMissing=Math.random()<0.5;

    wrongCounters[rowId+'-name']=0;
    wrongCounters[rowId+'-origin']=0;

    const nimCell=nimMissing
      ?`<input type="text" id="${rowId}-nim-input" oninput="val(this,'${rowId}','nim')" data-ans="${s.NIM}" placeholder="Isi NIM...">`
      :`${s.NIM}`;
    const nameCell=!nimMissing
      ?`<input type="text" id="${rowId}-name-input" oninput="val(this,'${rowId}','name')" data-ans="${s.Name}" placeholder="Isi nama...">`
      :`${s.Name}`;

    tr.innerHTML=`
      <td data-label="NIM">${nimCell}</td>
      <td data-label="Nama Mahasiswa">${nameCell}</td>
      <td data-label="Asal Tinggal"><input type="text" id="${rowId}-origin-input" oninput="val(this,'${rowId}','origin')" data-ans="${s.Origin}" placeholder="Isi asal..."></td>
      <td data-label="Status" class="status-cell">
        <span id="${rowId}-status">⚪</span>
        <div id="${rowId}-help-box"></div>
      </td>`;
    tbody.appendChild(tr);
  });
}

function updateStat(){
  const bar=document.getElementById('stat-bar');
  bar.innerHTML=`
    <div class="stat-pill">Total: <span>${currentScore.total}</span></div>
    <div class="stat-pill">Selesai: <span id="stat-done">0</span></div>`;
}

function val(input,rowId,type){
  const user=input.value.trim().toLowerCase();
  const ans=input.getAttribute('data-ans').trim().toLowerCase();
  const inputKey=rowId+'-'+type;

  if(user===ans){
    input.classList.add('correct');
    input.classList.remove('wrong');
  } else {
    input.classList.remove('correct');
    if(user.length>=Math.max(3,ans.length*0.3)){
      input.classList.add('wrong');
      if(!input.dataset.lastWrong || !user.startsWith(input.dataset.lastWrong)){
         wrongCounters[inputKey]++;
         input.dataset.lastWrong = user;
      }
    } else {
      input.classList.remove('wrong');
    }
  }

  const row=input.closest('tr');
  const inputs=row.querySelectorAll('input');
  const done=[...inputs].every(i=>i.value.trim().toLowerCase()===i.getAttribute('data-ans').trim().toLowerCase());
  const statusEl=document.getElementById(rowId+'-status');
  const wasDone=statusEl.textContent==='✅';

  statusEl.textContent=done?'✅':'⚪';

  if(done){
    statusEl.textContent='✅';
    document.getElementById(rowId+'-help-box').innerHTML='';
  }

  if(done&&!wasDone){
    const doneEl=document.getElementById('stat-done');
    if(doneEl) doneEl.textContent=parseInt(doneEl.textContent||0)+1;
  } else if(!done&&wasDone){
    const doneEl=document.getElementById('stat-done');
    if(doneEl) doneEl.textContent=Math.max(0,parseInt(doneEl.textContent||0)-1);
  }

  if(!done && wrongCounters[inputKey]>=3){
    showHelpButton(rowId);
  }
}

function showHelpButton(rowId){
  const helpBox=document.getElementById(rowId+'-help-box');
  if(helpBox && helpBox.innerHTML===''){
    helpBox.innerHTML=`<button class="give-up-btn" onclick="revealRowAnswers('${rowId}')">Bantuan?</button>`;
  }
}

function revealRowAnswers(rowId){
  const helpBox=document.getElementById(rowId+'-help-box');
  const statusEl=document.getElementById(rowId+'-status');
  const wasDone=statusEl.textContent==='✅';

  ['nim','name','origin'].forEach(type=>{
    const input=document.getElementById(`${rowId}-${type}-input`);
    if(input){
      input.value=input.getAttribute('data-ans');
      input.classList.add('correct');
      input.classList.remove('wrong');
    }
  });

  statusEl.textContent='✅';
  if(helpBox) helpBox.innerHTML='';

  if(!wasDone){
    const doneEl=document.getElementById('stat-done');
    if(doneEl) doneEl.textContent=parseInt(doneEl.textContent||0)+1;
  }
}

function searchDatabase(){
  const q=document.getElementById('db-search').value.toLowerCase();
  const tbody=document.getElementById('db-body');
  tbody.innerHTML='';
  studentsData
    .filter(s=>s.Name.toLowerCase().includes(q)||s.NIM.toString().includes(q))
    .forEach(s=>{
      const tr=document.createElement('tr');
      tr.className='data-row';
      tr.innerHTML=`<td data-label="NIM">${s.NIM}</td><td data-label="Nama Mahasiswa">${s.Name}</td><td data-label="Asal">${s.Origin}</td>`;
      tbody.appendChild(tr);
    });
}

init();
</script>
</body>
